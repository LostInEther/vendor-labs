lab:
  title: EtherChannel not bundling
  version: 0.2.2
  description: sw1 and sw2 joined by two links bundled as Port-channel1 (LACP), trunking VLANs 10 and 20.
  notes: 'Blog: https://josephoshaughnessy.hashnode.dev'
nodes:
- id: n0
  label: sw1
  node_definition: ioll2-xe
  x: -200
  y: 0
  configuration: |
    hostname sw1
    no ip domain lookup
    logging buffered 64000
    vtp mode transparent
    !
    vlan 10
     name USERS
    vlan 20
     name SERVERS
    !
    interface Ethernet0/0
     description to sw2 e0/0
     switchport trunk encapsulation dot1q
     switchport mode trunk
     switchport trunk allowed vlan 10,20
     channel-group 1 mode active
     no shutdown
    !
    interface Ethernet0/1
     description to sw2 e0/1
     switchport trunk encapsulation dot1q
     switchport mode trunk
     switchport trunk allowed vlan 10,20
     channel-group 1 mode active
     no shutdown
    !
    interface Port-channel1
     description to sw2
     switchport trunk encapsulation dot1q
     switchport mode trunk
     switchport trunk allowed vlan 10,20
    !
    interface Vlan10
     ip address 198.51.100.1 255.255.255.0
     no shutdown
    !
    interface Vlan20
     ip address 203.0.113.1 255.255.255.0
     no shutdown
    !
    line con 0
     exec-timeout 0 0
     logging synchronous
    !
    end
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    slot: 0
    type: physical
  - id: i2
    label: Ethernet0/1
    slot: 1
    type: physical
  - id: i3
    label: Ethernet0/2
    slot: 2
    type: physical
  - id: i4
    label: Ethernet0/3
    slot: 3
    type: physical
- id: n1
  label: sw2
  node_definition: ioll2-xe
  x: 200
  y: 0
  configuration: |
    hostname sw2
    no ip domain lookup
    logging buffered 64000
    vtp mode transparent
    !
    vlan 10
     name USERS
    vlan 20
     name SERVERS
    !
    interface Ethernet0/0
     description to sw1 e0/0
     switchport trunk encapsulation dot1q
     switchport mode trunk
     switchport trunk allowed vlan 10,20
     channel-group 1 mode active
     no shutdown
    !
    interface Ethernet0/1
     description to sw1 e0/1
     switchport trunk encapsulation dot1q
     switchport mode trunk
     switchport trunk allowed vlan 10,20
     channel-group 1 mode active
     no shutdown
    !
    interface Port-channel1
     description to sw1
     switchport trunk encapsulation dot1q
     switchport mode trunk
     switchport trunk allowed vlan 10,20
    !
    interface Vlan10
     ip address 198.51.100.2 255.255.255.0
     no shutdown
    !
    interface Vlan20
     ip address 203.0.113.2 255.255.255.0
     no shutdown
    !
    line con 0
     exec-timeout 0 0
     logging synchronous
    !
    end
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    slot: 0
    type: physical
  - id: i2
    label: Ethernet0/1
    slot: 1
    type: physical
  - id: i3
    label: Ethernet0/2
    slot: 2
    type: physical
  - id: i4
    label: Ethernet0/3
    slot: 3
    type: physical
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
  label: sw1 e0/0 - sw2 e0/0
- id: l1
  n1: n0
  i1: i2
  n2: n1
  i2: i2
  label: sw1 e0/1 - sw2 e0/1
