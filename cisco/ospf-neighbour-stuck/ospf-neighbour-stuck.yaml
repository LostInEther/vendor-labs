lab:
  title: OSPF neighbour stuck
  version: 0.2.2
  description: r1 -- r2 -- r3. Area 0 between r1 and r2, area 1 between r2 and r3 (r2 is the ABR).
  notes: 'Blog: https://josephoshaughnessy.hashnode.dev'
nodes:
- id: n0
  label: r1
  node_definition: iol-xe
  x: -300
  y: 0
  configuration: |
    hostname r1
    no ip domain lookup
    logging buffered 64000
    !
    interface Loopback0
     ip address 192.0.2.1 255.255.255.255
     ip ospf 1 area 0
    !
    interface Ethernet0/0
     description to r2
     ip address 198.51.100.1 255.255.255.252
     ip ospf 1 area 0
     no shutdown
    !
    router ospf 1
     router-id 192.0.2.1
     passive-interface Loopback0
    !
    line con 0
     exec-timeout 0 0
     logging synchronous
    !
    end
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    slot: 0
    type: physical
  - id: i2
    label: Ethernet0/1
    slot: 1
    type: physical
  - id: i3
    label: Ethernet0/2
    slot: 2
    type: physical
  - id: i4
    label: Ethernet0/3
    slot: 3
    type: physical
- id: n1
  label: r2
  node_definition: iol-xe
  x: 0
  y: 0
  configuration: |
    hostname r2
    no ip domain lookup
    logging buffered 64000
    !
    interface Loopback0
     ip address 192.0.2.2 255.255.255.255
     ip ospf 1 area 0
    !
    interface Ethernet0/0
     description to r1
     ip address 198.51.100.2 255.255.255.252
     ip ospf 1 area 0
     no shutdown
    !
    interface Ethernet0/1
     description to r3
     ip address 198.51.100.5 255.255.255.252
     ip ospf 1 area 1
     no shutdown
    !
    router ospf 1
     router-id 192.0.2.2
     passive-interface Loopback0
    !
    line con 0
     exec-timeout 0 0
     logging synchronous
    !
    end
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    slot: 0
    type: physical
  - id: i2
    label: Ethernet0/1
    slot: 1
    type: physical
  - id: i3
    label: Ethernet0/2
    slot: 2
    type: physical
  - id: i4
    label: Ethernet0/3
    slot: 3
    type: physical
- id: n2
  label: r3
  node_definition: iol-xe
  x: 300
  y: 0
  configuration: |
    hostname r3
    no ip domain lookup
    logging buffered 64000
    !
    interface Loopback0
     ip address 192.0.2.3 255.255.255.255
     ip ospf 1 area 1
    !
    interface Loopback1
     description branch LAN
     ip address 203.0.113.1 255.255.255.0
     ip ospf network point-to-point
     ip ospf 1 area 1
    !
    interface Ethernet0/0
     description to r2
     ip address 198.51.100.6 255.255.255.252
     ip ospf 1 area 1
     no shutdown
    !
    router ospf 1
     router-id 192.0.2.3
     passive-interface Loopback0
     passive-interface Loopback1
    !
    line con 0
     exec-timeout 0 0
     logging synchronous
    !
    end
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    slot: 0
    type: physical
  - id: i2
    label: Ethernet0/1
    slot: 1
    type: physical
  - id: i3
    label: Ethernet0/2
    slot: 2
    type: physical
  - id: i4
    label: Ethernet0/3
    slot: 3
    type: physical
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
  label: r1 e0/0 - r2 e0/0
- id: l1
  n1: n1
  i1: i2
  n2: n2
  i2: i1
  label: r2 e0/1 - r3 e0/0
