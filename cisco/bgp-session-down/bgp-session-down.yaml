lab:
  title: BGP session down
  version: 0.2.2
  description: cust01 (AS 64511) -- pe01 (AS 64500) -- pe02 (AS 64500). eBGP on the cust01-pe01 link, iBGP between pe01 and pe02 loopbacks over OSPF.
  notes: 'Blog: https://josephoshaughnessy.hashnode.dev'
nodes:
- id: n0
  label: cust01
  node_definition: iol-xe
  x: -300
  y: 0
  configuration: |
    hostname cust01
    no ip domain lookup
    !
    interface Loopback0
     description customer LAN
     ip address 203.0.113.1 255.255.255.0
    !
    interface Ethernet0/0
     description to pe01
     ip address 198.51.100.2 255.255.255.252
     no shutdown
    !
    router bgp 64511
     bgp router-id 203.0.113.1
     bgp log-neighbor-changes
     neighbor 198.51.100.1 remote-as 64500
     neighbor 198.51.100.1 description pe01
     !
     address-family ipv4
      network 203.0.113.0 mask 255.255.255.0
      neighbor 198.51.100.1 activate
     exit-address-family
    !
    line con 0
     exec-timeout 0 0
     logging synchronous
    !
    end
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    slot: 0
    type: physical
  - id: i2
    label: Ethernet0/1
    slot: 1
    type: physical
  - id: i3
    label: Ethernet0/2
    slot: 2
    type: physical
  - id: i4
    label: Ethernet0/3
    slot: 3
    type: physical
- id: n1
  label: pe01
  node_definition: iol-xe
  x: 0
  y: 0
  configuration: |
    hostname pe01
    no ip domain lookup
    !
    interface Loopback0
     ip address 192.0.2.11 255.255.255.255
    !
    interface Ethernet0/0
     description to cust01
     ip address 198.51.100.1 255.255.255.252
     no shutdown
    !
    interface Ethernet0/1
     description to pe02
     ip address 192.0.2.1 255.255.255.252
     ip ospf network point-to-point
     no shutdown
    !
    router ospf 1
     router-id 192.0.2.11
     passive-interface Loopback0
     network 192.0.2.0 0.0.0.3 area 0
     network 192.0.2.11 0.0.0.0 area 0
    !
    router bgp 64500
     bgp router-id 192.0.2.11
     bgp log-neighbor-changes
     neighbor 198.51.100.2 remote-as 64511
     neighbor 198.51.100.2 description cust01
     neighbor 192.0.2.12 remote-as 64500
     neighbor 192.0.2.12 description pe02
     neighbor 192.0.2.12 update-source Loopback0
     !
     address-family ipv4
      neighbor 198.51.100.2 activate
      neighbor 192.0.2.12 activate
      neighbor 192.0.2.12 next-hop-self
     exit-address-family
    !
    line con 0
     exec-timeout 0 0
     logging synchronous
    !
    end
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    slot: 0
    type: physical
  - id: i2
    label: Ethernet0/1
    slot: 1
    type: physical
  - id: i3
    label: Ethernet0/2
    slot: 2
    type: physical
  - id: i4
    label: Ethernet0/3
    slot: 3
    type: physical
- id: n2
  label: pe02
  node_definition: iol-xe
  x: 300
  y: 0
  configuration: |
    hostname pe02
    no ip domain lookup
    !
    interface Loopback0
     ip address 192.0.2.12 255.255.255.255
    !
    interface Loopback1
     description stand-in for the provider's own routes
     ip address 198.51.100.129 255.255.255.128
    !
    interface Ethernet0/0
     description to pe01
     ip address 192.0.2.2 255.255.255.252
     ip ospf network point-to-point
     no shutdown
    !
    router ospf 1
     router-id 192.0.2.12
     passive-interface Loopback0
     network 192.0.2.0 0.0.0.3 area 0
     network 192.0.2.12 0.0.0.0 area 0
    !
    router bgp 64500
     bgp router-id 192.0.2.12
     bgp log-neighbor-changes
     neighbor 192.0.2.11 remote-as 64500
     neighbor 192.0.2.11 description pe01
     neighbor 192.0.2.11 update-source Loopback0
     !
     address-family ipv4
      network 198.51.100.128 mask 255.255.255.128
      neighbor 192.0.2.11 activate
     exit-address-family
    !
    line con 0
     exec-timeout 0 0
     logging synchronous
    !
    end
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    slot: 0
    type: physical
  - id: i2
    label: Ethernet0/1
    slot: 1
    type: physical
  - id: i3
    label: Ethernet0/2
    slot: 2
    type: physical
  - id: i4
    label: Ethernet0/3
    slot: 3
    type: physical
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
  label: cust01 e0/0 - pe01 e0/0
- id: l1
  n1: n1
  i1: i2
  n2: n2
  i2: i1
  label: pe01 e0/1 - pe02 e0/0
