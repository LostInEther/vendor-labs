lab:
  title: IPsec GRE tunnel down
  version: 0.2.2
  description: r1 -- inet -- r2. GRE over IPsec (IKEv2) between r1 and r2, OSPF over the tunnel for the site LANs.
  notes: 'Blog: https://josephoshaughnessy.hashnode.dev'
nodes:
- id: n0
  label: r1
  node_definition: iol-xe
  x: -300
  y: 0
  configuration: |
    hostname r1
    no ip domain lookup
    logging buffered 64000
    !
    crypto ikev2 proposal PROP
     encryption aes-cbc-256
     integrity sha256
     group 14
    crypto ikev2 policy POL
     proposal PROP
    !
    crypto ikev2 keyring KR
     peer SITE-B
      address 192.0.2.6
      pre-shared-key LabOnlyKey123
    !
    crypto ikev2 profile IKEV2-PROF
     match identity remote address 192.0.2.6 255.255.255.255
     authentication remote pre-share
     authentication local pre-share
     keyring local KR
    !
    crypto ipsec transform-set TS esp-aes 256 esp-sha256-hmac
     mode transport
    !
    crypto ipsec profile IPSEC-PROF
     set transform-set TS
     set ikev2-profile IKEV2-PROF
    !
    interface Loopback1
     description site LAN
     ip address 203.0.113.1 255.255.255.128
     ip ospf network point-to-point
     ip ospf 1 area 0
    !
    interface Ethernet0/0
     description to inet
     ip address 192.0.2.2 255.255.255.252
     no shutdown
    !
    interface Tunnel0
     description GRE over IPsec to SITE-B
     ip address 198.51.100.1 255.255.255.252
     ip mtu 1400
     ip tcp adjust-mss 1360
     ip ospf 1 area 0
     tunnel source Ethernet0/0
     tunnel destination 192.0.2.6
     tunnel protection ipsec profile IPSEC-PROF
    !
    router ospf 1
     router-id 192.0.2.2
     passive-interface Loopback1
    !
    ip route 0.0.0.0 0.0.0.0 192.0.2.1
    !
    line con 0
     exec-timeout 0 0
     logging synchronous
    !
    end
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    slot: 0
    type: physical
  - id: i2
    label: Ethernet0/1
    slot: 1
    type: physical
  - id: i3
    label: Ethernet0/2
    slot: 2
    type: physical
  - id: i4
    label: Ethernet0/3
    slot: 3
    type: physical
- id: n1
  label: inet
  node_definition: iol-xe
  x: 0
  y: 0
  configuration: |
    hostname inet
    no ip domain lookup
    logging buffered 64000
    !
    interface Ethernet0/0
     description to r1
     ip address 192.0.2.1 255.255.255.252
     no shutdown
    !
    interface Ethernet0/1
     description to r2
     ip address 192.0.2.5 255.255.255.252
     no shutdown
    !
    line con 0
     exec-timeout 0 0
     logging synchronous
    !
    end
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    slot: 0
    type: physical
  - id: i2
    label: Ethernet0/1
    slot: 1
    type: physical
  - id: i3
    label: Ethernet0/2
    slot: 2
    type: physical
  - id: i4
    label: Ethernet0/3
    slot: 3
    type: physical
- id: n2
  label: r2
  node_definition: iol-xe
  x: 300
  y: 0
  configuration: |
    hostname r2
    no ip domain lookup
    logging buffered 64000
    !
    crypto ikev2 proposal PROP
     encryption aes-cbc-256
     integrity sha256
     group 14
    crypto ikev2 policy POL
     proposal PROP
    !
    crypto ikev2 keyring KR
     peer SITE-A
      address 192.0.2.2
      pre-shared-key LabOnlyKey123
    !
    crypto ikev2 profile IKEV2-PROF
     match identity remote address 192.0.2.2 255.255.255.255
     authentication remote pre-share
     authentication local pre-share
     keyring local KR
    !
    crypto ipsec transform-set TS esp-aes 256 esp-sha256-hmac
     mode transport
    !
    crypto ipsec profile IPSEC-PROF
     set transform-set TS
     set ikev2-profile IKEV2-PROF
    !
    interface Loopback1
     description site LAN
     ip address 203.0.113.129 255.255.255.128
     ip ospf network point-to-point
     ip ospf 1 area 0
    !
    interface Ethernet0/0
     description to inet
     ip address 192.0.2.6 255.255.255.252
     no shutdown
    !
    interface Tunnel0
     description GRE over IPsec to SITE-A
     ip address 198.51.100.2 255.255.255.252
     ip mtu 1400
     ip tcp adjust-mss 1360
     ip ospf 1 area 0
     tunnel source Ethernet0/0
     tunnel destination 192.0.2.2
     tunnel protection ipsec profile IPSEC-PROF
    !
    router ospf 1
     router-id 192.0.2.6
     passive-interface Loopback1
    !
    ip route 0.0.0.0 0.0.0.0 192.0.2.5
    !
    line con 0
     exec-timeout 0 0
     logging synchronous
    !
    end
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    slot: 0
    type: physical
  - id: i2
    label: Ethernet0/1
    slot: 1
    type: physical
  - id: i3
    label: Ethernet0/2
    slot: 2
    type: physical
  - id: i4
    label: Ethernet0/3
    slot: 3
    type: physical
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
  label: r1 e0/0 - inet e0/0
- id: l1
  n1: n1
  i1: i2
  n2: n2
  i2: i1
  label: inet e0/1 - r2 e0/0
